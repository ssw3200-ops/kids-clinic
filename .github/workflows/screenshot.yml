name: 블로그용 화면 캡처

on:
  workflow_dispatch:
    inputs:
      night_time:
        description: "밤 화면 기준 시각"
        default: "2026-11-19T21:30:00+09:00"

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: 캡처
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          NIGHT_TIME: ${{ inputs.night_time }}
        run: python tools/screenshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          retention-days: 3
